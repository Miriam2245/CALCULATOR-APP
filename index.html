<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main-container">
      <div class="heading-container">
        <h1>calc</h1>
        <div class="theme-container">
          <p>THEME</p>
          <button class="theme-btn">mi</button>
        </div>
      </div>
      <div class="input-container">
        <input type="number" class="input-field" />
      </div>
      <div class="button-container">
        <p>
          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="delete-btn">DEL</button>
        </p>
        <p>
          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn">+</button>
        </p>
        <p>
          <button class="btn">3</button>
          <button class="btn">2</button>
          <button class="btn">1</button>
          <button class="btn">-</button>
        </p>
        <p>
          <button class="btn">.</button>
          <button class="btn">0</button>
          <button class="btn">/</button>
          <button class="btn">*</button>
        </p>
        <p>
          <button class="reset-btn">RESET</button>
          <button class="equal-btn">=</button>
        </p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
